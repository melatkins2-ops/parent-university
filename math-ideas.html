<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Learning Ideas | Parent University</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#19394f;font-family:Arial,Helvetica,sans-serif}header{background:#123b5a;color:#fff;padding:18px max(20px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:22px}header a{color:#fff}main{max-width:1000px;margin:auto;padding:36px 22px 70px}h1{font-size:clamp(32px,5vw,46px);margin:10px 0}h2{font-size:clamp(24px,3vw,30px)}h3{font-size:21px;margin:0 0 9px}p{font-size:18px;line-height:1.6}.eyebrow{font-size:14px;color:#a65220;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.tabs button{border:2px solid #b9cbd5;border-radius:9px;background:#fff;color:#174c70;padding:12px 18px;font:700 16px Arial;cursor:pointer}.tabs button[aria-pressed=true]{background:#123b5a;color:#fff;border-color:#123b5a}.tabs button:focus-visible{outline:3px solid #b85c28;outline-offset:3px}.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:20px 0}.idea{background:#fff;border:1px solid #dce1e4;border-radius:12px;padding:22px}.idea p{font-size:17px;margin:0 0 15px}.try{background:#f5f0e9;border-left:4px solid #d77b39;padding:13px 15px;font-size:16px;line-height:1.55}.support{background:#eaf2f5;border-radius:10px;padding:19px 22px;margin-top:18px;font-size:17px;line-height:1.55}.support strong{display:block;margin-bottom:6px}@media(max-width:700px){.ideas{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr}.tabs button{text-align:left}}@media print{header,.tabs{display:none}.ideas{grid-template-columns:1fr 1fr}.idea{break-inside:avoid}}</style></head><body><header><strong>Parent University</strong><a href="./index.html">Back to Parent University</a></header><main><div class="eyebrow">Family ideas · Learning at home</div><h1 id="title"></h1><p id="intro"></p><div class="tabs" role="group" aria-label="Choose school level"><button type="button" data-age="elementary" aria-pressed="true">Elementary · K–5</button><button type="button" data-age="middle" aria-pressed="false">Middle · 6–8</button><button type="button" data-age="high" aria-pressed="false">High school · 9–12</button></div><section id="content" aria-live="polite"></section></main><script>const data={"path":"math-ideas.html","title":"Math in Everyday Life","intro":"Math is more than worksheets. Use everyday decisions to build confidence, problem-solving, and number sense at any age.","levels":{"elementary":{"title":"Elementary school · Grades K–5","intro":"Use ordinary objects and routines to make math visible.","ideas":[["Count and compare","Sort socks, count steps, or compare groups of objects.","Ask: “Which pile has more? How do you know?”"],["Cook with numbers","Measure ingredients and talk about halves, doubles, and quantities.","Let your child measure a half cup twice and describe what happened."],["Play with money","Compare prices or count coins during a pretend store game.","Give your child a small pretend budget and ask what they can buy."],["Notice shapes and patterns","Look for shapes and repeated patterns at home or outside.","Go on a five-minute shape hunt together."]],"support":"If your child is struggling with a particular math skill, ask the teacher for one example of how it is taught at school."},"middle":{"title":"Middle school · Grades 6–8","intro":"Build reasoning and confidence through real choices.","ideas":[["Compare deals","Use grocery prices, unit prices, and discounts to reason about value.","Ask: “Which package is the better deal? Show me how you decided.”"],["Plan with a budget","Give a realistic spending limit for a meal, activity, or gift.","Have your child explain the trade-offs they made."],["Use ratios in recipes","Scale ingredients up or down for a different number of people.","Double a recipe and check whether each amount changes correctly."],["Talk through mistakes","Ask how your child reached an answer instead of immediately correcting it.","Try: “Walk me through your thinking.”"]],"support":"If homework is repeatedly stressful, ask the math teacher which concept needs attention and what practice is most useful."},"high":{"title":"High school · Grades 9–12","intro":"Connect math to financial decisions and future opportunities.","ideas":[["Compare real costs","Explore phone plans, transportation costs, or subscription prices.","Calculate the annual cost of two options."],["Understand pay and time","Use a sample work schedule to estimate gross earnings.","Ask what changes when hours or pay rates change."],["Read charts critically","Look at a chart from a news story and discuss what it shows and leaves out.","Ask: “Does the scale change how the information looks?”"],["Explore interest and borrowing","Discuss how interest changes the total cost of borrowing.","Compare two hypothetical repayment options without sharing personal finances."]],"support":"If your teen is concerned about passing a math course, ask the teacher or counselor about tutoring, course expectations, and a realistic recovery plan."}}};document.getElementById('title').textContent=data.title;document.getElementById('intro').textContent=data.intro;function render(age){document.querySelectorAll('[data-age]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===age)));const root=document.getElementById('content');root.replaceChildren();const d=data.levels[age];const h=document.createElement('h2');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.intro;root.append(h,p);const grid=document.createElement('div');grid.className='ideas';d.ideas.forEach(([name,description,example])=>{const article=document.createElement('article');article.className='idea';const h3=document.createElement('h3');h3.textContent=name;const text=document.createElement('p');text.textContent=description;const tip=document.createElement('div');tip.className='try';const strong=document.createElement('strong');strong.textContent='Try this: ';tip.append(strong,document.createTextNode(example));article.append(h3,text,tip);grid.append(article)});root.append(grid);const support=document.createElement('div');support.className='support';const strong=document.createElement('strong');strong.textContent='When to connect with school';support.append(strong,document.createTextNode(d.support));root.append(support)}document.querySelectorAll('[data-age]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.age)));render('elementary');</script></body></html>
