<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance | Parent University</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#18334b;background:#f7f8f8}*{box-sizing:border-box}body{margin:0}header{background:#123c5c;color:white;padding:18px max(20px,calc((100vw - 980px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}header strong{font-size:21px}header a{color:white;font-size:16px}main{max-width:920px;margin:auto;padding:30px 22px 80px}.eyebrow{color:#a75420;font-size:14px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,45px);line-height:1.15;margin:10px 0}h2{font-size:clamp(23px,3vw,30px)}p{font-size:18px;line-height:1.6}.intro{max-width:700px}.progress{font-weight:bold;color:#476275;margin:25px 0 10px}.panel{background:#fff;border:1px solid #d7dfe4;border-radius:14px;padding:clamp(20px,4vw,36px);box-shadow:0 3px 12px #102d4410}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:20px 0}.choice{display:block;text-align:left;padding:18px;border:2px solid #c7d3dc;border-radius:10px;background:white;color:#173c58;cursor:pointer;font-size:17px;line-height:1.35;font-weight:700}.choice[aria-pressed=true]{border-color:#bb6029;background:#fff4eb}.choice:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #bc642b;outline-offset:3px}.tip{background:#edf4f6;border-left:5px solid #2d6c86;padding:17px 20px;border-radius:5px;margin:20px 0;font-size:17px;line-height:1.55}.next{background:#bd6029;color:white;border:0;border-radius:8px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer}.secondary{background:white;color:#173c58;border:2px solid #173c58;border-radius:8px;padding:12px 20px;font-size:17px;font-weight:bold;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}label{display:block;font-size:17px;font-weight:bold;margin:20px 0 9px}textarea{width:100%;min-height:90px;padding:14px;font:17px Arial;border:2px solid #8d9fac;border-radius:8px}.small{font-size:15px;color:#455a6c}ul{font-size:17px;line-height:1.65;padding-left:24px}@media print{header,.actions,.progress,.eyebrow{display:none}body{background:white}main{padding:0}.panel{box-shadow:none;border:0}}</style></head><body><header><strong>Parent University</strong><a href="./index.html">Back to Parent University</a></header><main><span class="eyebrow">Family learning • practical guide</span><h1>Helping My Scholar Get to School</h1><p class="intro">Attendance concerns can have different causes. This guide helps you understand what may be happening, choose a realistic response, and know when to ask the school for support.</p><div class="progress" id="progress" aria-live="polite"></div><section class="panel" id="panel" aria-live="polite"></section></main><script>(()=>{const cases=[{id:'morning',name:'Mornings are difficult',context:'Your scholar is often late because getting ready takes longer than expected.',ask:'Which part of the morning is hardest—waking up, getting ready, leaving, or something else?',options:['Ask your scholar what makes mornings difficult.','Prepare clothing, supplies, and transportation plans the night before.','Agree on a simple wake-up and departure routine, then review it together.'],school:'If lateness continues, ask the school what patterns they see and whether a staff member can help you problem-solve.'},{id:'transport',name:'Transportation is unreliable',context:'Your scholar wants to attend, but transportation has been inconsistent.',ask:'Is the challenge the bus route, timing, an unexpected change, or something else?',options:['Record when and how transportation breaks down.','Contact the school to confirm transportation arrangements and report recurring problems.','Develop a backup plan with a trusted adult when possible.'],school:'Contact the school promptly about transportation barriers. Ask who will follow up and when.'},{id:'avoid',name:'My scholar does not want to go',context:'Your scholar says they do not want to attend school but may not explain why.',ask:'What is your scholar telling you about friendships, safety, classes, belonging, or stress?',options:['Listen without immediately arguing about attendance.','Ask when school feels hardest and what would help your scholar feel supported.','Contact a teacher, counselor, or school administrator to understand what is happening.'],school:'If your scholar reports bullying, feeling unsafe, or serious distress, contact the school promptly and request a specific support plan.'},{id:'health',name:'Health concerns interfere',context:'Illness, appointments, or ongoing health needs have made attendance difficult.',ask:'What is preventing attendance, and what guidance have you received about when your scholar can return?',options:['Follow appropriate medical guidance and the school’s illness procedures.','Tell the school about recurring absences and ask how to keep up with learning.','Discuss ongoing needs with the school nurse or appropriate staff.'],school:'Ask the school about attendance and learning supports when health needs are ongoing.'},{id:'unsure',name:'I am not sure what is happening',context:'You notice missed days or lateness but do not yet know the main reason.',ask:'What patterns can you see across days, classes, or times of day?',options:['Review attendance information with your scholar.','Ask open-ended questions about what happens before an absence.','Request a conversation with school staff to compare what you each notice.'],school:'Ask the school to review attendance patterns with you and identify one possible barrier to investigate.'}];let stage=0,chosen=null,selected=[],note='',follow='';const $=id=>document.getElementById(id),escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(t,fn,cl='next'){let b=document.createElement('button');b.type='button';b.className=cl;b.textContent=t;b.onclick=fn;return b}function actions(){let d=document.createElement('div');d.className='actions';return d}function render(){const p=$('panel');p.replaceChildren();$('progress').textContent='Step '+(stage+1)+' of 3';const title=document.createElement('h2');const para=document.createElement('p');const group=document.createElement('div');group.className='choices';p.append(title,para);if(stage===0){title.textContent='What is making attendance difficult?';para.textContent='Choose the situation that best matches what your family is experiencing. You can come back and choose another.';cases.forEach(c=>{let b=btn(c.name,()=>{chosen=c;selected=[];note='';follow='';stage=1;render()},'choice');group.append(b)});p.append(group)}else if(stage===1){title.textContent='Understand the barrier and choose a response';para.textContent=chosen.context;let tip=document.createElement('div');tip.className='tip';tip.textContent='Start by asking: '+chosen.ask;p.append(tip);let h=document.createElement('h3');h.textContent='Which approaches could help? Choose up to two.';p.append(h);chosen.options.forEach((o,i)=>{let b=btn(o,()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);render()},'choice');b.setAttribute('aria-pressed',String(selected.includes(i)));group.append(b)});p.append(group);let label=document.createElement('label');label.htmlFor='family-note';label.textContent='What have you learned about the situation? (Optional)';let ta=document.createElement('textarea');ta.id='family-note';ta.placeholder='A short note about the barrier';ta.value=note;ta.oninput=()=>note=ta.value;p.append(label,ta);let a=actions();a.append(btn('Back',()=>{stage=0;render()},'secondary'),btn('Build my plan',()=>{note=ta.value;stage=2;render()}));p.append(a);let s=document.createElement('p');s.className='small';s.textContent='You can continue without selecting a strategy.';p.append(s)}else{title.textContent='Your family attendance plan';para.textContent='Use this plan as a starting point. Adjust it with your scholar and school as needed.';let h=document.createElement('h3');h.textContent='Situation';p.append(h);let q=document.createElement('p');q.textContent=chosen.name;p.append(q);if(note){let n=document.createElement('p');n.textContent='What I noticed: '+note;p.append(n)}h=document.createElement('h3');h.textContent='Strategies to try';p.append(h);let ul=document.createElement('ul');(selected.length?selected.map(i=>chosen.options[i]):['Talk with my scholar to better understand the barrier.']).forEach(t=>{let li=document.createElement('li');li.textContent=t;ul.append(li)});p.append(ul);let tip=document.createElement('div');tip.className='tip';tip.textContent='When to involve the school: '+chosen.school;p.append(tip);let label=document.createElement('label');label.htmlFor='followup';label.textContent='When will you check whether the plan is helping?';let ta=document.createElement('textarea');ta.id='followup';ta.placeholder='Example: Friday after school, we will review the week together.';ta.value=follow;ta.oninput=()=>follow=ta.value;p.append(label,ta);let a=actions();a.append(btn('Back to strategies',()=>{follow=ta.value;stage=1;render()},'secondary'),btn('Print my plan',()=>{follow=ta.value;window.print()}),btn('Start over',()=>{stage=0;chosen=null;selected=[];note='';follow='';render()},'secondary'));p.append(a);let privacy=document.createElement('p');privacy.className='small';privacy.textContent='Your answers are not sent to GRPS or stored online. Printing uses your browser.';p.append(privacy)}}render()})();</script></body></html>
