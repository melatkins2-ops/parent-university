name: Publish Family Learning Studio
on:
  push:
    paths: ['.github/workflows/publish-family-learning-studio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate interactive learning activities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          if 'id="familyLearningStudio"' in s:raise SystemExit('Already installed; no change needed')
          section="""<section id="familyLearningStudio" class="puStudio" aria-labelledby="puStudioTitle">
          <div class="puStudioTop"><span class="puEyebrow">DO SOMETHING TOGETHER</span><h2 id="puStudioTitle">The Family Learning Studio</h2><p>Choose a real situation, practice a skill, and leave with a next step you can use this week.</p></div>
          <div class="puStudioTabs" role="group" aria-label="Choose a family activity"><button type="button" data-studio="attendance" aria-pressed="true">Build an attendance routine</button><button type="button" data-studio="reading" aria-pressed="false">Make reading part of the day</button><button type="button" data-studio="conference" aria-pressed="false">Prepare for a school conversation</button></div>
          <div class="puStudioContent" aria-live="polite"><div id="puStudioProgress"></div><h3 id="puStudioStepTitle"></h3><p id="puStudioPrompt"></p><div id="puStudioChallenge"></div><label for="puStudioResponse" id="puStudioResponseLabel">Your response</label><textarea id="puStudioResponse" rows="4" placeholder="Write a practical idea you can try."></textarea><div class="puStudioActions"><button type="button" id="puStudioBack">Previous</button><button type="button" id="puStudioNext">Next step</button><button type="button" id="puStudioPrint" hidden>Print my plan</button></div><p class="puStudioPrivacy">Your responses stay on this screen unless you print. Nothing is submitted to GRPS.</p></div></section>"""
          style="""<style id="pu-studio-style">.puStudio{margin:30px auto;padding:clamp(20px,4vw,42px);background:#fff9ee;border:1px solid #e7d7b9;border-radius:22px;color:#24382e;max-width:1200px;scroll-margin-top:120px}.puStudio h2{font-size:clamp(28px,3vw,42px);margin:8px 0}.puStudio h3{font-size:clamp(22px,2.5vw,30px)}.puStudio p{font-size:17px;line-height:1.55}.puEyebrow{font-weight:800;letter-spacing:.08em;color:#865526}.puStudioTabs,.puStudioActions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.puStudio button{padding:12px 18px;border:2px solid #24513e;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#24513e}.puStudioTabs button{border-radius:30px}.puStudio button[aria-pressed=true],.puStudioActions button{background:#24513e;color:#fff}.puStudioContent{border-top:1px solid #d9cbb8;padding-top:22px;max-width:850px}.puStudioChallenge{background:#edf3e9;border-left:5px solid #6a8b64;padding:16px;border-radius:8px;font-size:17px;line-height:1.55}.puStudio label{display:block;margin:16px 0 8px;font-size:16px;font-weight:700}.puStudio textarea{width:100%;box-sizing:border-box;min-height:110px;border:2px solid #a8b2a4;border-radius:12px;padding:14px;font:17px system-ui}.puStudio button:focus-visible,.puStudio textarea:focus-visible{outline:3px solid #b06c2b;outline-offset:3px}.puStudioPrivacy{font-size:14px!important}.puStudio button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:600px){.puStudio{margin:20px 0;padding:20px}.puStudioTabs{display:grid;grid-template-columns:1fr}.puStudioTabs button{text-align:left}}</style>"""
          script="""<script id="pu-studio-script">(function(){function init(){const programs={attendance:[['Notice the pattern','When is getting to school hardest?','Challenge: A scholar misses the first 20 minutes twice a week. What would you ask before deciding whether the issue is transportation, sleep, or something else?','What pattern do you want to understand?'],['Try one small change','Choose a routine that addresses the barrier.','What could your family prepare the night before? Who at school could help with transportation or another barrier?','What change will you try for five school days?'],['Check and follow up','Choose a way to see whether the change helped.','If the barrier continues, contact the school and describe what you already tried.','When will you check progress, and who can help?']],reading:[['Start with connection','Let your scholar choose something interesting to read.','A comic, recipe, book, article, or sports story can start a useful conversation.','What will your scholar choose?'],['Practice together','Spend ten minutes reading or discussing.','Instead of asking “Did you understand?”, try “What surprised you?” or “What would you do next?”','What question will you ask?'],['Make it a routine','Choose a manageable time.','Try three ten-minute reading conversations this week. Notice whether your scholar explains more and asks questions.','When will you try it, and what will you notice?']],conference:[['Name your purpose','Start with one clear concern or goal.','Instead of “My scholar is struggling,” name a specific observation and the skill you want to understand.','What would you like to understand or change?'],['Ask a stronger question','Invite the school and family to work together.','Ask “What are you seeing at school? What strengths can we build on? What is one strategy we can both try?”','What two questions will you ask?'],['Agree on next steps','Leave with an action, owner, and follow-up date.','Write what you will do at home, what support you will request from school, and when you will reconnect.','What will you do first, and when will you follow up?']]};let program='attendance',step=0;const responses={attendance:['','',''],reading:['','',''],conference:['','','']};const $=id=>document.getElementById(id);function save(){responses[program][step]=$('puStudioResponse').value}function render(){const a=programs[program][step];$('puStudioProgress').textContent='Activity '+(step+1)+' of 3';$('puStudioStepTitle').textContent=a[0];$('puStudioPrompt').textContent=a[1];$('puStudioChallenge').textContent=a[2];$('puStudioResponseLabel').textContent=a[3];$('puStudioResponse').value=responses[program][step];$('puStudioBack').disabled=step===0;$('puStudioNext').textContent=step===2?'Start again':'Next step';$('puStudioPrint').hidden=step!==2;document.querySelectorAll('[data-studio]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.studio===program)))}document.querySelectorAll('[data-studio]').forEach(b=>b.addEventListener('click',()=>{save();program=b.dataset.studio;step=0;render()}));$('puStudioBack').addEventListener('click',()=>{save();if(step>0)step--;render()});$('puStudioNext').addEventListener('click',()=>{save();step=step===2?0:step+1;render()});$('puStudioPrint').addEventListener('click',()=>{save();const lines=programs[program].map((a,i)=>a[0]+'\\n'+a[3]+'\\n'+(responses[program][i]||'Not answered')).join('\\n\\n');const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print your plan.');return}w.document.write('<!doctype html><title>My Family Action Plan</title><style>body{font:18px/1.6 system-ui;max-width:760px;margin:40px auto;padding:20px}pre{white-space:pre-wrap;font:inherit}</style><h1>My Family Action Plan</h1><pre></pre>');w.document.querySelector('pre').textContent=lines;w.document.close();w.focus();w.print()});render()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init()})();</script>"""
          needle='<section class="view active" data-page="home">'
          if needle not in s:raise SystemExit('Homepage anchor not found')
          s=s.replace(needle,needle+section,1)
          if '</head>' not in s or '</body>' not in s:raise SystemExit('Missing HTML anchors')
          s=s.replace('</head>',style+'</head>',1).replace('</body>',script+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Publish interactive Family Learning Studio"; git push; fi
