<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Learning Ideas | Parent University</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#19394f;font-family:Arial,Helvetica,sans-serif}header{background:#123b5a;color:#fff;padding:18px max(20px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:22px}header a{color:#fff}main{max-width:1000px;margin:auto;padding:36px 22px 70px}h1{font-size:clamp(32px,5vw,46px);margin:10px 0}h2{font-size:clamp(24px,3vw,30px)}h3{font-size:21px;margin:0 0 9px}p{font-size:18px;line-height:1.6}.eyebrow{font-size:14px;color:#a65220;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.tabs button{border:2px solid #b9cbd5;border-radius:9px;background:#fff;color:#174c70;padding:12px 18px;font:700 16px Arial;cursor:pointer}.tabs button[aria-pressed=true]{background:#123b5a;color:#fff;border-color:#123b5a}.tabs button:focus-visible{outline:3px solid #b85c28;outline-offset:3px}.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:20px 0}.idea{background:#fff;border:1px solid #dce1e4;border-radius:12px;padding:22px}.idea p{font-size:17px;margin:0 0 15px}.try{background:#f5f0e9;border-left:4px solid #d77b39;padding:13px 15px;font-size:16px;line-height:1.55}.support{background:#eaf2f5;border-radius:10px;padding:19px 22px;margin-top:18px;font-size:17px;line-height:1.55}.support strong{display:block;margin-bottom:6px}@media(max-width:700px){.ideas{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr}.tabs button{text-align:left}}@media print{header,.tabs{display:none}.ideas{grid-template-columns:1fr 1fr}.idea{break-inside:avoid}}</style></head><body><header><strong>Parent University</strong><a href="./index.html">Back to Parent University</a></header><main><div class="eyebrow">Family ideas · Learning at home</div><h1 id="title"></h1><p id="intro"></p><div class="tabs" role="group" aria-label="Choose school level"><button type="button" data-age="elementary" aria-pressed="true">Elementary · K–5</button><button type="button" data-age="middle" aria-pressed="false">Middle · 6–8</button><button type="button" data-age="high" aria-pressed="false">High school · 9–12</button></div><section id="content" aria-live="polite"></section></main><script>const data={"path":"reading-ideas.html","title":"Reading and Talking Together","intro":"Reading support looks different as children grow. Find realistic ways to build understanding, vocabulary, and confidence without turning home into another classroom.","levels":{"elementary":{"title":"Elementary school · Grades K–5","intro":"Make reading a shared, enjoyable part of everyday life.","ideas":[["Let your child choose","Comics, picture books, recipes, and stories all offer opportunities to read.","Ask your child to choose something to read together for ten minutes."],["Talk about the story","Ask questions that invite thinking rather than testing.","Try: “What surprised you?” or “What do you think will happen next?”"],["Read everyday print","Use menus, signs, instructions, or grocery lists to practice reading.","Ask your child to help find three items on a shopping list."],["Celebrate effort","Notice when your child tries a difficult word or explains an idea.","Say what you noticed: “You went back to figure that out.”"]],"support":"If reading is consistently frustrating, ask the teacher which specific skill to practice and what a manageable home activity could look like."},"middle":{"title":"Middle school · Grades 6–8","intro":"Connect reading with interests, identity, and real-world information.","ideas":[["Follow their interests","Sports coverage, graphic novels, biographies, and articles all count.","Ask your child to recommend one article or story to you."],["Discuss different viewpoints","Compare two short articles or opinions about a topic they care about.","Ask: “What evidence makes this convincing?”"],["Build vocabulary in context","Notice unfamiliar words while reading rather than assigning long word lists.","Choose one word and use it in a conversation later."],["Make room for independent reading","Offer choice and a predictable time without turning it into a punishment.","Try a ten-minute family reading break with everyone choosing their own material."]],"support":"If your child avoids reading because classwork feels too difficult, ask the teacher what reading support is available and how to help without overwhelming them."},"high":{"title":"High school · Grades 9–12","intro":"Support critical reading, communication, and independence.","ideas":[["Discuss real-world information","Read an article, job posting, or issue your teen is interested in.","Ask: “What is the author's main point? What would you want to verify?”"],["Connect reading to future plans","Explore career descriptions, training programs, college materials, or financial information.","Invite your teen to compare two options and explain the trade-offs."],["Talk about sources","Discuss how to evaluate claims and distinguish evidence from opinion.","Compare two sources covering the same topic."],["Support challenging coursework","Help your teen identify what is confusing and formulate a question for the teacher.","Ask: “Which paragraph or idea is hardest to explain?”"]],"support":"If reading or writing difficulties affect grades, ask the teacher or counselor about available academic support and next steps."}}};document.getElementById('title').textContent=data.title;document.getElementById('intro').textContent=data.intro;function render(age){document.querySelectorAll('[data-age]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===age)));const root=document.getElementById('content');root.replaceChildren();const d=data.levels[age];const h=document.createElement('h2');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.intro;root.append(h,p);const grid=document.createElement('div');grid.className='ideas';d.ideas.forEach(([name,description,example])=>{const article=document.createElement('article');article.className='idea';const h3=document.createElement('h3');h3.textContent=name;const text=document.createElement('p');text.textContent=description;const tip=document.createElement('div');tip.className='try';const strong=document.createElement('strong');strong.textContent='Try this: ';tip.append(strong,document.createTextNode(example));article.append(h3,text,tip);grid.append(article)});root.append(grid);const support=document.createElement('div');support.className='support';const strong=document.createElement('strong');strong.textContent='When to connect with school';support.append(strong,document.createTextNode(d.support));root.append(support)}document.querySelectorAll('[data-age]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.age)));render('elementary');</script></body></html>
